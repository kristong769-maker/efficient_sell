<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam 一键出售</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOCAL STEAM TOOL</div>
        <h1>库存一键出售</h1>
      </div>
      <div id="account" class="account">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">正在检查登录状态…</span>
        <button id="logoutButton" class="text-button hidden" type="button">退出工具登录</button>
      </div>
    </header>

    <section id="loginPanel" class="card login-card hidden">
      <div>
        <h2>先连接 Steam</h2>
        <p>登录会在独立的 Steam 官方页面完成。工具不会读取或保存你的密码。</p>
      </div>
      <button id="loginButton" class="primary" type="button">打开 Steam 登录</button>
    </section>

    <section id="workspace" class="workspace hidden">
      <section class="card form-card">
        <div class="step-label"><span>1</span> 选择商品与出售方式</div>
        <div class="filter-grid">
          <div>
            <label for="category">商品种类</label>
            <select id="category">
              <option value="all">全部可售商品</option>
              <option value="weapon_case">武器箱</option>
              <option value="key">钥匙</option>
              <option value="trading_card">集换式卡牌</option>
              <option value="specific">特定商品</option>
            </select>
          </div>
          <div>
            <label for="itemName">搜索商品</label>
            <input id="itemName" type="text" maxlength="160"
                   placeholder="输入名称或关键词" autocomplete="off" disabled>
          </div>
          <div>
            <label for="matchMode">匹配方式</label>
            <select id="matchMode" disabled>
              <option value="contains">包含关键词</option>
              <option value="exact">精确匹配</option>
            </select>
          </div>
        </div>
        <p id="categoryHint" class="hint">扫描库存中的全部可售商品；此分类无需搜索。</p>
        <div class="sale-mode-grid">
          <div class="sale-mode-card">
            <strong>上架出售</strong>
            <span>自定义价格，或跟随当前市场最低价创建挂单</span>
            <div class="sale-actions">
              <button id="scanButton" class="primary" type="button">扫描后自定义价格</button>
              <button id="lowestButton" class="market-lowest" type="button">以市场底价上架</button>
            </div>
          </div>
          <div class="sale-mode-card instant">
            <strong>即时出售</strong>
            <span>按当前最高求购价优先成交</span>
            <button id="highestButton" class="market-highest" type="button">以最高求购价出售</button>
          </div>
        </div>
      </section>

      <section id="previewPanel" class="card preview-card hidden">
        <div class="preview-heading">
          <div class="step-label"><span>2</span> 核对与定价</div>
          <span id="liveInventory" class="live-inventory">库存快照</span>
        </div>
        <div class="summary-grid">
          <div><strong id="matchCount">0</strong><span>匹配数量</span></div>
          <div><strong id="contextCount">0</strong><span>已扫描库存</span></div>
          <div><strong id="assetCount">0</strong><span>已检查物品</span></div>
        </div>
        <div id="warningBox" class="warning hidden"></div>
        <div id="itemGroups" class="item-groups"></div>

        <div class="pricing">
          <div>
            <label for="quantity">出售数量</label>
            <input id="quantity" type="number" min="1" value="1" inputmode="numeric">
            <button id="allButton" class="text-button inline" type="button">全部</button>
          </div>
          <div>
            <label for="price">每件价格 <span id="currencyCode"></span></label>
            <input id="price" type="text" inputmode="decimal" placeholder="例如 1.00">
          </div>
          <div>
            <label for="priceMode">价格含义</label>
            <select id="priceMode">
              <option value="buyer">买家支付总价</option>
              <option value="receive">卖家实收金额</option>
            </select>
          </div>
        </div>
        <div id="quote" class="quote">输入价格后显示手续费预估</div>
        <label class="confirm-check">
          <input id="confirmCheck" type="checkbox">
          我已核对物品、数量和每件价格，确认创建市场挂单
        </label>
        <button id="sellButton" class="danger" type="button" disabled>一键出售</button>
      </section>

      <section id="progressPanel" class="card progress-card hidden">
        <div class="step-label"><span>3</span> 上架进度</div>
        <div class="progress-heading">
          <strong id="progressText">准备中…</strong>
          <span id="progressNumbers"></span>
        </div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <div id="resultSummary" class="result-summary"></div>
        <div id="resultList" class="result-list"></div>
      </section>
    </section>

    <div id="toast" class="toast hidden" role="status"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
